name: dbt Tests and Validation

on:
  push:
    branches:
      - main
    paths:
      - 'analytics-dbt/**'
  pull_request:
    branches:
      - main
    paths:
      - 'analytics-dbt/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "NON-PROD"
        type: choice
        options:
          - NON-PROD
          - PROD
      action:
        description: Action to perform
        required: true 
        default: "Validate"
        type: choice
        options:
          - Validate
          - Deploy

jobs:
  dbt-test:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'Validate')
    runs-on: ubuntu-latest
    
    # if github.event_name = 'workflow_dispatch' then environment = inputs.environment else environment = 'NON-PROD'
    # "environment" là biến môi trường của github action, dùng để chọn bộ secrets theo environment nào
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'NON-PROD' }}

    # Use to avoid running this tasl multiple times at once
    concurrency:
      group: dbt-test-${{ github.ref }}
      # If there is a new workflow running with the group, The running job will be canceled. Only keep the latest job
      cancel-in-progress: true
      
    permissions:
      contents: read
      
    # Runtime environment variables
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'NON-PROD' }}
      # Vì dbt không biết khái niệm NON-PROD nên phải đổi NON-PROD thành dev
      DBT_TARGET: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment || 'NON-PROD') == 'PROD' && 'prod' || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'            # Cache pip dependencies, which means the dependencies installed via pip will be cached between runs. 
                                  # As a result, subsequent runs will not need to reinstall all dependencies, speeding up the workflow.
      
      - name: Install dbt and dependencies
        working-directory: ./analytics-dbt
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Set up dbt profiles
        run: |
          mkdir -p ${{ github.workspace }}/.dbt
          cat <<EOF > ${{ github.workspace }}/.dbt/profiles.yml
          default:
            target: ${DBT_TARGET}
            outputs:
              ${DBT_TARGET}:
                type: snowflake
                threads: 16
                account: ${DBT_ACCOUNT}
                user: ${DBT_USER}
                database: ${DBT_DATABASE}
                warehouse: ${DBT_WAREHOUSE}
                schema: ${DBT_SCHEMA}
                password: ${DBT_PASSWORD}
                role: ${DBT_ROLE}
          EOF
          chmod 600 ${{ github.workspace }}/.dbt/profiles.yml
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt
          DBT_TARGET: ${{ env.DBT_TARGET }}
          DBT_ACCOUNT: ${{ secrets.DBT_ACCOUNT }}
          DBT_USER: ${{ secrets.DBT_USER }}
          DBT_DATABASE: ${{ secrets.DBT_DATABASE }}
          DBT_WAREHOUSE: ${{ secrets.DBT_WAREHOUSE }}
          DBT_SCHEMA: ${{ secrets.DBT_SCHEMA }}
          DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
          DBT_ROLE: ${{ secrets.DBT_ROLE }}

      - name: Install dbt packages
        working-directory: ./analytics-dbt
        run: dbt deps
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt
      
      - name: Run dbt parse (validate syntax)
        working-directory: ./analytics-dbt
        run: dbt parse
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt
      
      - name: Run dbt tests
        working-directory: ./analytics-dbt
        run: dbt test
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt
      
      - name: Run dbt docs generate
        working-directory: ./analytics-dbt
        run: dbt docs generate
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt
      
      - name: Upload dbt artifacts
        if: always()
        # The "if: always()" condition ensures that this step always runs regardless of the outcome of previous steps.
        uses: actions/upload-artifact@v6.0.0
        # Uploads the dbt artifacts generated in the analytics-dbt/target/ directory as an artifact of the workflow run.
        with:
          name: dbt-artifacts
          path: |
            analytics-dbt/target/manifest.json
            analytics-dbt/target/run_results.json
  
  dbt-deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'Deploy'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Trigger dbt Cloud Job
        run: |
          response=$(curl -X POST \
            -H "Authorization: Token ${DBT_TOKEN_VALUE}" \
            -H "Content-Type: application/json" \
            -d "{\"cause\": \"Triggered via GitHub Actions - ${{ inputs.environment }}\"}" \
            https://cw723.us1.dbt.com/api/v2/accounts/${DBT_ACCOUNT_ID}/jobs/${DBT_JOB_ID}/run/)
          
          echo "dbt Cloud API Response:"
          echo "$response"
          
          # Extract run ID from response (optional - for tracking)
          run_id=$(echo "$response" | grep -o '"id":[0-9]*' | head -1 | cut -d':' -f2)
          echo "dbt Cloud Run ID: $run_id"
        env:
          DBT_ACCOUNT_ID: ${{ secrets.DBT_ACCOUNT_ID }}
          DBT_JOB_ID: ${{ secrets.DBT_JOB_ID }}
          DBT_TOKEN_VALUE: ${{ secrets.DBT_TOKEN_VALUE }}
