name: Terraform CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'infra-aws-terraform/**'
  pull_request:
    branches:
      - main
    paths:
      - 'infra-aws-terraform/**'
  
  # Manual deployment trigger
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "NON-PROD"
        type: choice
        options:
          - NON-PROD
          - PROD
      action:
        description: "Action to perform"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

env:
  terraform-version: 1.14.3

jobs:
  # Validation job - runs on push and PR
  terraform-validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.terraform-version }}
      
      - name: Terraform Format Check
        working-directory: ./infra-aws-terraform
        run: terraform fmt -check -recursive
      
      - name: Terraform Init
        working-directory: ./infra-aws-terraform
        run: terraform init -backend=false
      
      - name: Terraform Validate
        working-directory: ./infra-aws-terraform
        run: terraform validate

  # Plan job - runs only on workflow_dispatch with action=plan
  terraform-plan:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'plan'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.terraform-version }}
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      
      - name: Terraform Init (Dev)
        if: inputs.environment == 'NON-PROD'
        working-directory: ./infra-aws-terraform/dvd-rental-infra
        run: terraform init
      
      - name: Terraform Plan (Dev)
        if: inputs.environment == 'NON-PROD'
        working-directory: ./infra-aws-terraform/dvd-rental-infra
        run: terraform plan -out=tfplan-dev
      
      - name: Upload Terraform Plan (Dev)
        if: inputs.environment == 'NON-PROD'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: infra-aws-terraform/dvd-rental-infra/tfplan-dev
          retention-days: 5
      
      - name: Terraform Init (Prod)
        if: inputs.environment == 'PROD'
        working-directory: ./infra-aws-terraform/dvd-rental-infra
        run: terraform init
      
      - name: Terraform Plan (Prod)
        if: inputs.environment == 'PROD'
        working-directory: ./infra-aws-terraform/dvd-rental-infra
        run: terraform plan -out=tfplan-prod
      
      - name: Upload Terraform Plan (Prod)
        if: inputs.environment == 'PROD'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: infra-aws-terraform/dvd-rental-infra/tfplan-prod
          retention-days: 5

  # Apply job - runs only on workflow_dispatch with action=apply
  terraform-apply:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.terraform-version }}
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      
      - name: Download Terraform Plan (Dev)
        if: inputs.environment == 'NON-PROD'
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: infra-aws-terraform/dvd-rental-infra/
      
      - name: Terraform Init (Dev)
        if: inputs.environment == 'NON-PROD'
        working-directory: ./infra-aws-terraform/dvd-rental-infra
        run: terraform init
      
      - name: Terraform Apply (Dev)
        if: inputs.environment == 'NON-PROD'
        working-directory: ./infra-aws-terraform/dvd-rental-infra
        run: terraform apply tfplan-dev
      
      - name: Download Terraform Plan (Prod)
        if: inputs.environment == 'PROD'
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: infra-aws-terraform/dvd-rental-infra/
      
      - name: Terraform Init (Prod)
        if: inputs.environment == 'PROD'
        working-directory: ./infra-aws-terraform/dvd-rental-infra
        run: terraform init
      
      - name: Terraform Apply (Prod)
        if: inputs.environment == 'PROD'
        working-directory: ./infra-aws-terraform/dvd-rental-infra
        run: terraform apply tfplan-prod