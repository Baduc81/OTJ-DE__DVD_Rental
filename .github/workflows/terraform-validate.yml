name: Terraform Validate and Plan

on:
  push:
    branches:
      - main
    paths:
      - 'infra-aws-terraform/**'
  pull_request:
    branches:
      - main
    paths:
      - 'infra-aws-terraform/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "NON-PROD"
        type: choice
        options:
          - NON-PROD
          - PROD

env:
  terraform-version: 1.7.5
# SQL Linting
jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'NON-PROD' }}
    concurrency:
      group: terraform-validate-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'NON-PROD' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.terraform-version }}
      
      - name: Terraform Format Check
        working-directory: ./infra-aws-terraform
        run: terraform fmt -check -recursive
      
      - name: Terraform Init
        working-directory: ./infra-aws-terraform
        run: terraform init -backend=false
      
      - name: Terraform Validate
        working-directory: ./infra-aws-terraform
        run: terraform validate
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: arn:aws:iam::874831691917:role/github-actions-terraform-role
          aws-region: us-east-1

      - name: Terraform Init (Dev)
        if: env.DEPLOY_ENV == 'NON-PROD'
        working-directory: ./infra-aws-terraform/dvd-rental-infra
        run: terraform init

      - name: Terraform Plan (Dev)
        if: env.DEPLOY_ENV == 'NON-PROD'
        working-directory: ./infra-aws-terraform/dvd-rental-infra/env/dev
        run: terraform plan -out=tfplan

      - name: Terraform Init (Prod)
        if: env.DEPLOY_ENV == 'PROD'
        working-directory: ./infra-aws-terraform/dvd-rental-infra
        run: terraform init

      - name: Terraform Plan (Prod)
        if: env.DEPLOY_ENV == 'PROD'
        working-directory: ./infra-aws-terraform/dvd-rental-infra/env/prod
        run: terraform plan -out=tfplan
