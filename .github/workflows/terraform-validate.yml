name: Terraform Validate and Plan

on:
  push:
    branches:
      - main
    paths:
      - 'infra-aws-terraform/**'
  pull_request:
    branches:
      - main
    paths:
      - 'infra-aws-terraform/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  terraform-version: 1.7.5
# SQL Linting
jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-validate-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.terraform-version }}
      
      - name: Terraform Format Check
        working-directory: ./infra-aws-terraform
        run: terraform fmt -check -recursive
      
      - name: Terraform Init
        working-directory: ./infra-aws-terraform
        run: terraform init -backend=false
      
      - name: Terraform Validate
        working-directory: ./infra-aws-terraform
        run: terraform validate
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: arn:aws:iam::874831691917:role/github-actions-terraform-role
          aws-region: us-east-1

      - name: Terraform Init (Dev)
        working-directory: ./infra-aws-terraform/envs/dev
        run: terraform init -backend=false

      - name: Terraform Plan (Dev)
        working-directory: ./infra-aws-terraform/envs/dev
        run: terraform plan -out=tfplan
