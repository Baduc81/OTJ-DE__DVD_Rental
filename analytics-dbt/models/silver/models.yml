version: 2

models:
  # --- CATEGORY ---
  - name: category
    config:
      materialized: table
      schema: silver
    description: "Temporary table for categories with duplicate flagging."
    columns:
      - name: category_id
        tests: [not_null]
      - name: category_name
        tests: [not_null]
      - name: record_hash
        tests: [not_null]
      - name: is_current
        tests: [not_null]

