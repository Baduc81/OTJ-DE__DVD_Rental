version: 2

models:
  # --- CATEGORY ---
  - name: category_tmp
    config:
      materialized: table
      schema: bronze
    description: "Temporary table for categories with duplicate flagging."
    columns:
      - name: category_id
        tests: [not_null]
      - name: category_name
        tests: [not_null]
      - name: is_duplicated_file
        tests: [not_null]
      - name: is_duplicated_version
        tests: [not_null]

  - name: category_rejected
    description: "Rejected category records (duplicates)."

