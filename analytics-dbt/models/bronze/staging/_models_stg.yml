models:
  - name: stg_category
    description: "Staging table for the category table from the DVD Rental database."
    columns:
      - name: category_id
        description: "Primary key"
        tests:
          - not_null
      - name: category_name
        description: "The name of the category."
        tests:
          - not_null
      - name: valid_from
        description: "Timestamp of the last update to the category record."
      - name: file_name
        description: "The source file name from which the record was loaded."
      - name: load_timestamp
        description: "Timestamp when the record was loaded into the staging table."

  - name: stg_film_category
    description: "Staging table for the film_category table from the DVD Rental database."
    columns:
      - name: film_category_id
        description: "Primary key"
        tests:
          - not_null
      - name: film_id
        description: "Foreign key to the film table."
        tests:
          - not_null
          - relationships:
              to: ref('stg_film')
              field: film_id
      - name: category_id
        description: "Foreign key to the category table."
        tests:
          - not_null
          - relationships:
              to: ref('stg_category')
              field: category_id
      - name: valid_from
        description: "Timestamp of the last update to the film_category record."
      - name: file_name
        description: "The source file name from which the record was loaded."
      - name: load_timestamp
        description: "Timestamp when the record was loaded into the staging table."
  
  - name: stg_film
    description: "Staging table for the film table from the DVD Rental database."
    columns:
      - name: film_id
        description: "Primary key"
        tests:
          - not_null
      - name: title
        description: "The title of the film."
      - name: film_description
        description: "A description of the film."
      - name: release_year
        description: "The year the film was released."
      - name: language_id
        description: "Foreign key to the language table."
        tests:
          - not_null
          - relationships:
              to: ref('stg_language')
              field: language_id
      - name: rental_duration
        description: "The duration for which the film can be rented."
      - name: rental_rate
        description: "The rental rate for the film."
      - name: film_length
        description: "The length of the film"
      - name: replacement_cost
        description: "The cost to replace the film."
      - name: rating
        description: "The rating of the film."
      - name: special_features
        description: "Special features included with the film."
      - name: film_fulltext
        description: "Full text search field for the film."
      - name: valid_from
        description: "Timestamp of the last update to the film record."
      - name: file_name
        description: "The source file name from which the record was loaded."
      - name: load_timestamp
        description: "Timestamp when the record was loaded into the staging table."
  
  - name: stg_payment
    description: "Staging table for the payment table from the DVD Rental database."
    columns:
      - name: payment_id
        description: "Primary key"
        tests:
          - not_null
      - name: customer_id
        description: "Foreign key to the customer table."
        tests:
          - not_null
          - relationships:
              to: ref('stg_customer')
              field: customer_id
      - name: staff_id
        description: "Foreign key to the staff table."
        tests:
          - not_null
          - relationships:
              to: ref('stg_staff')
              field: staff_id
      - name: rental_id
        description: "Foreign key to the rental table."
        tests:
          - not_null
          - relationships:
              to: ref('stg_rental')
              field: rental_id
      - name: amount
        description: "The payment amount."
      - name: valid_from
        description: "Timestamp of the last update to the payment record."
      - name: file_name
        description: "The source file name from which the record was loaded."
      - name: load_timestamp
        description: "Timestamp when the record was loaded into the staging table."
  
  - name: stg_film_actor
    description: "Staging table for the film_actor table from the DVD Rental database."
    columns:
      - name: film_actor_id
        description: "Primary key"
        tests:
          - not_null
      - name: film_id
        description: "Foreign key to the film table."
        tests:
          - not_null
          - relationships:
              to: ref('stg_film')
              field: film_id
      - name: actor_id
        description: "Foreign key to the actor table."
        tests:
          - not_null
          - relationships:
              to: ref('stg_actor')
              field: actor_id
      - name: valid_from
        description: "Timestamp of the last update to the film_actor record."
      - name: file_name
        description: "The source file name from which the record was loaded."
      - name: load_timestamp
        description: "Timestamp when the record was loaded into the staging table."

  - name: stg_customer
    description: "Staging table for the customer table from the DVD Rental database."
    columns:
      - name: customer_id
        description: "Primary key"
        tests:
          - not_null
      - name: store_id
        description: "Foreign key to the store table"
        tests:
          - not_null
          - relationships:
              to: ref('stg_store')
              field: store_id
      - name: first_name
        description: "The first name of the customer"
      - name: last_name
        description: "The last name of the customer"
      - name: email
        description: "The email of the customer"
      - name: address_id
        description: "Foreign key to the address table"
        tests:
          - not_null
          - relationships:
              to: ref('stg_address')
              field: address_id
      - name: activebool
        description: "Indicates whether the customer is active"
      - name: create_date
        description: "The date the customer record was created"
      - name: valid_from
        description: "Timestamp of the last update to the customer record"
      - name: active
        description: ""
      - name: file_name
        description: "The source file name from which the record was loaded"
      - name: load_timestamp
        description: "Timestamp when the record was loaded into staging table"

  - name: stg_address
    description: "Staging table for the address table from the DVD Rental database."
    columns:
      - name: address_id
        description: "Primary key"
        tests:
          - not_null
      - name: address
        description: "The address."
      - name: address2
        description: "Additional address."
      - name: district
        description: "The district of the address."
      - name: city_id
        description: "Foreign key to the city table."
        tests:
          - not_null
          - relationships:
              to: ref('stg_city')
