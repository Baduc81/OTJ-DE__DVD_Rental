models:
  - name: stg_category
    description: "Staging table for the category table from the DVD Rental database."
    columns:
      - name: category_id
        description: "Primary key"
      - name: category_name
        description: "The name of the category."
      - name: valid_from
        description: "Timestamp of the last update to the category record."
      - name: file_name
        description: "The source file name from which the record was loaded."
      - name: load_timestamp
        description: "Timestamp when the record was loaded into the staging table."

